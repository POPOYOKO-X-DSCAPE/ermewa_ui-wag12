name: Deployment

on: [ push ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: startsWith(github.repository, 'POPOYOKO-X-DSCAPE/')

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.LOUIS_EMRMEWA_GIT_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Mirror push to target repository
      run: |
        git config --global user.name "louis-ermewa"
        git config --global user.email "louis.dauvergne.ext@ermewa.com"
        git remote add mirror git@github.com:ermewa/ui-wag12.git
        git branch -v
        git push -u mirror HEAD:main --force

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: 🧁 Set up bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: |
        bunx vite build || (bun check && bun add $(bun check | grep -oP '(?<=\s)[^ ]+(?=\s)' | tr '\n' ' '))

    - name: Build project
      run: bunx vite build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
